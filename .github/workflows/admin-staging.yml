name: Admin-staging
on:
  push:
    branches: [dev]
    # Publish semver tags as releases.
    tags: ['v*.*.*']
  # dev 브랜치에서 수동 실행 시 :dev 이미지를 다시 빌드
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # 도커 이미지에 env 파일 포함
      - name: Create .env file
        run: |
          touch .env
          echo "${{ secrets.ENV_VARS_ADMIN }}" >> apps/admin/.env

      # 도커 메타데이터 가져오기
      - name: Docker meta
        id: docker_meta
        uses: crazy-max/ghaction-docker-meta@v1
        with:
          images: david0218/dudoong-admin
          tag-semver: |
            {{version}}
            {{major}}.{{minor}}

      # 런타임(nginx) 스테이지의 arm64 RUN 단계를 x86 러너에서 실행하기 위한 QEMU 에뮬레이터 셋업
      # (빌더는 BUILDPLATFORM 네이티브라 에뮬레이션 구간은 rm 한 줄뿐이다)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # 도커 빌드 관련 셋업
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      # 내 도커허브 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 도커이미지 빌드하고 허브로 푸쉬
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.admin
          platforms: linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
