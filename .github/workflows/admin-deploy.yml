name: Build & Docker Push - Admin
on:
  push:
    # branches: [fix/admin-deploy]
    # paths: ['apps/admin/src/**']
    # Publish semver tags as releases.
    tags:
      - Admin-v*.*.*
  # 이미 배포된 버전을 같은 소스로 다시 빌드할 때 사용 (예: ref=Admin-v1.1.2, version=1.1.2)
  workflow_dispatch:
    inputs:
      ref:
        description: '빌드할 git 태그 (예: Admin-v1.1.2)'
        required: true
      version:
        description: '푸시할 이미지 태그 (예: 1.1.2)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # 수동 재빌드(옛 태그)는 소스만 태그 것을 쓰고 Dockerfile 은 이 워크플로를 실행한 커밋의 것을 쓴다 (#336)
      # 옛 Dockerfile 은 빌드 도구가 바뀌어 지금은 실패할 수 있다 (예: Admin-v1.1.2 의 전역 yarn 설치)
      - name: Use current Dockerfile for manual rebuild
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD -- Dockerfile.admin

      # 도커 이미지에 env 파일 포함
      - name: Create .env file
        run: |
          touch .env
          echo "${{ secrets.ENV_VARS_ADMIN }}" >> apps/admin/.env
      # 도커 메타데이터 가져오기
      - name: Get the version
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            RELEASE_VERSION_WITHOUT_V="$INPUT_VERSION"
          else
            RELEASE_VERSION_WITHOUT_V="$(cut -d'v' -f2 <<< ${GITHUB_REF#refs/*/})"
          fi
          if ! [[ "$RELEASE_VERSION_WITHOUT_V" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "잘못된 이미지 태그: $RELEASE_VERSION_WITHOUT_V" >&2
            exit 1
          fi
          echo ::set-output name=VERSION::$RELEASE_VERSION_WITHOUT_V

      # arm64 크로스 빌드를 위한 QEMU 에뮬레이터 셋업
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # 도커 빌드 관련 셋업
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      # 내 도커허브 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 도커이미지 빌드하고 허브로 푸쉬
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.admin
          platforms: linux/amd64,linux/arm64
          push: true
          tags: david0218/dudoong-admin:${{ steps.get_version.outputs.VERSION }}
